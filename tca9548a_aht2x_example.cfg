# Define the mux. Address is usually 0x70 when A0/A1/A2 are tied low.
[tca9548a mux1]
i2c_mcu: mmu
i2c_bus: i2c2_PB10_PB11
i2c_address: 112 # 0x70, A0/A1/A2 all low; use 113-119 for 0x71-0x77
# i2c_speed: 100000
# debug_no_disable: True
# select_delay: 0.01
# verify_select: True

[temperature_sensor Lane_0]
sensor_type: AHT2X_TCA9548A
tca9548a: mux1
tca9548a_channel: 0
i2c_address: 56
min_temp: -20
max_temp: 80
# debug_skip_init: True

